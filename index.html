<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 194 221'%3E%3Crect width='194' height='221' fill='white'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M0 86.8541L0.0241885 221L43.9943 201.05V66.9282L0 86.8541ZM61.4811 59.6822L149.494 164.216V19.9262L193.488 0V192.91L132.999 221L61.4811 133.808V59.6822Z' fill='%23FF7300'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M0 19.9262L0.012093 44.1034L0.024186 68.2807L43.9943 48.306V0L0 19.9262Z' fill='%23000000'/%3E%3C/svg%3E">

    <!-- ====== WEB APP MANIFEST (PWA) ====== -->
    <link rel="manifest" href="manifest.json">
    
    <!-- ====== THEME COLOR ====== -->
    <meta name="theme-color" content="#FF7300">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Геолокация">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css">>
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="app-header">
            <div class="header-content">
                <h1>INSTALYATOR.PRO</h1>
                <div id="userInfo" class="user-info hidden">
                    <span id="userName">Пользователь</span>
                    <img id="userAvatar" src="" alt="Avatar" class="avatar">
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="app-content">
            <!-- Секция авторизации -->
            <div id="authSection" class="section">
                <div class="auth-card">
                    <div class="auth-icon">📍</div>
                    <h2>Геолокация сотрудников</h2>
                    <p>Войдите или зарегистрируйтесь для отправки геолокации</p>
                    
                    <!-- Форма входа (обернута в <form>) -->
                    <form id="loginForm" onsubmit="return false;">
                        <div class="form-group">
                            <label>Имя или Email</label>
                            <input type="text" id="loginName" placeholder="Введите имя или email" class="form-input" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="loginPassword" placeholder="Введите пароль" class="form-input" autocomplete="current-password">
                        </div>
                        <button type="button" id="loginBtn" class="btn btn-success btn-large">🔑 Войти</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToRegister" style="color:#2c3e7a;">Нет аккаунта? Зарегистрироваться</a>
                        </p>
                    </form>
                    
                    <!-- Форма регистрации (обернута в <form>) -->
                    <form id="registerForm" class="hidden" onsubmit="return false;">
                        <div class="form-group">
                            <label>Ваше имя</label>
                            <input type="text" id="registerName" placeholder="Иван Иванов" class="form-input" autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="registerEmail" placeholder="email@example.com" class="form-input" autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="registerPassword" placeholder="Минимум 4 символа" class="form-input" autocomplete="new-password">
                        </div>
                        <button type="button" id="registerBtn" class="btn btn-success btn-large">📝 Зарегистрироваться</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToLogin" style="color:#2c3e7a;">Уже есть аккаунт? Войти</a>
                        </p>
                    </form>
                </div>
            </div>

            <!-- Форма отправки геолокации -->
            <div id="geoSendSection" class="section hidden">
                <div class="geo-card">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                        <img id="userAvatarSmall" src="" alt="Avatar" style="width:40px;height:40px;border-radius:50%;">
                        <span id="userDisplay" style="font-weight:600;font-size:16px;"></span>
                    </div>

                    <div class="geo-status">
                        <div class="status-indicator" id="geoStatus">
                            <span class="dot"></span>
                            <span id="geoStatusText">Определение местоположения...</span>
                        </div>
                        <div id="geoCoords" class="coords-info hidden">
                            <small>Широта: <span id="lat">-</span></small>
                            <small>Долгота: <span id="lng">-</span></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comment">Комментарий</label>
                        <textarea id="comment" 
                                  placeholder="Например: Прибыл в офис, убыл на объект..."
                                  rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Фото</label>
                        <div class="photo-upload">
                            <input type="file" id="photoInput" accept="image/*" capture="environment">
                            <label for="photoInput" class="photo-label">
                                <span>📷 Добавить фото</span>
                            </label>
                            <div id="photoPreview" class="photo-preview hidden">
                                <img id="previewImg" src="" alt="Preview">
                                <button id="removePhotoBtn" class="btn-remove">✕</button>
                            </div>
                        </div>
                    </div>

                    <button id="sendGeoBtn" class="btn btn-success btn-large" disabled>
                        📤 Отправить геолокацию
                    </button>

                    <div id="sendStatus" class="send-status hidden"></div>
                </div>
            </div>

            <!-- История -->
            <div id="historySection" class="section hidden">
                <div class="history-card">
                    <h3>📋 История отправок</h3>
                    <div id="historyList" class="history-list"></div>
                </div>
            </div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button id="navSend" class="nav-btn">
                <span class="nav-icon">📍</span>
                <span class="nav-label">Отправить</span>
            </button>
            <button id="navHistory" class="nav-btn">
                <span class="nav-icon">📋</span>
                <span class="nav-label">История</span>
            </button>
            <button id="navAdmin" class="nav-btn">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Сотрудники</span>
            </button>
            <button id="logoutBtn" class="nav-btn">
                <span class="nav-icon">🚪</span>
                <span class="nav-label">Выйти</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
