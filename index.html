<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Геолокация сотрудников</title>
    
    <!-- ====== FAVICON ====== -->
    <link rel="icon" type="image/png" href="image/favicon.png">
    
    <!-- ====== APPLE TOUCH ICON (iPhone, iPad) ====== -->
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    
    <!-- ====== WEB APP MANIFEST ====== -->
    <link rel="manifest" href="manifest.json">
    
    <!-- ====== THEME COLOR ====== -->
    <meta name="theme-color" content="#FF7300">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Геолокация">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="app-header">
            <div class="header-content">
                <!-- Логотип в шапке -->
                <img src="image/logo-white.svg" 
                     alt="Инсталлятор.Про" 
                     class="header-logo"
                     onerror="this.outerHTML='<span style=\'color:white;font-weight:700;font-size:18px;\'>📍 Геолокация</span>'">
                
                <div id="userInfo" class="user-info hidden">
                    <span id="userName">Пользователь</span>
                    <img id="userAvatar" src="" alt="Avatar" class="avatar">
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="app-content">
            <!-- Секция авторизации -->
            <div id="authSection" class="section">
                <div class="auth-card">
                    <div class="auth-icon">📍</div>
                    <h2>Геолокация сотрудников</h2>
                    <p class="subtitle">Войдите или зарегистрируйтесь для отправки геолокации</p>
                    
                    <form id="loginForm" onsubmit="return false;">
                        <div class="form-group">
                            <label>Имя или Email</label>
                            <input type="text" id="loginName" placeholder="Введите имя или email" class="form-input" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="loginPassword" placeholder="Введите пароль" class="form-input" autocomplete="current-password">
                        </div>
                        <button type="button" id="loginBtn" class="btn btn-success btn-large">🔑 Войти</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToRegister">Нет аккаунта? Зарегистрироваться</a>
                        </p>
                    </form>
                    
                    <form id="registerForm" class="hidden" onsubmit="return false;">
                        <div class="form-group">
                            <label>Ваше имя</label>
                            <input type="text" id="registerName" placeholder="Иван Иванов" class="form-input" autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="registerEmail" placeholder="email@example.com" class="form-input" autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="registerPassword" placeholder="Минимум 4 символа" class="form-input" autocomplete="new-password">
                        </div>
                        <button type="button" id="registerBtn" class="btn btn-success btn-large">📝 Зарегистрироваться</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToLogin">Уже есть аккаунт? Войти</a>
                        </p>
                    </form>
                </div>
            </div>

            <!-- Форма отправки геолокации -->
            <div id="geoSendSection" class="section hidden">
                <div class="geo-card">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                        <img id="userAvatarSmall" src="" alt="Avatar" style="width:40px;height:40px;border-radius:50%;border:2px solid #FF7300;">
                        <span id="userDisplay" style="font-weight:600;font-size:16px;color:#ffffff;"></span>
                    </div>

                    <div class="geo-status">
                        <div class="status-indicator" id="geoStatus">
                            <span class="dot"></span>
                            <span id="geoStatusText">Определение местоположения...</span>
                        </div>
                        <div id="geoCoords" class="coords-info hidden">
                            <small>Широта: <span id="lat">-</span></small>
                            <small>Долгота: <span id="lng">-</span></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comment">Комментарий</label>
                        <textarea id="comment" 
                                  placeholder="Например: Прибыл в офис, убыл на объект..."
                                  rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Фото</label>
                        <div class="photo-upload">
                            <input type="file" id="photoInput" accept="image/*" capture="environment">
                            <label for="photoInput" class="photo-label">
                                <span>📷 Добавить фото</span>
                            </label>
                            <div id="photoPreview" class="photo-preview hidden">
                                <img id="previewImg" src="" alt="Preview">
                                <button id="removePhotoBtn" class="btn-remove">✕</button>
                            </div>
                        </div>
                    </div>

                    <button id="sendGeoBtn" class="btn btn-success btn-large" disabled>
                        📤 Отправить геолокацию
                    </button>

                    <div id="sendStatus" class="send-status hidden"></div>
                </div>
            </div>

            <!-- История -->
<div id="historySection" class="section hidden">
    <div class="history-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <h3 style="margin:0;">📋 История отправок</h3>
            <div style="display:flex;gap:8px;">
                <button id="exportExcelBtn" class="btn btn-success" style="width:auto;padding:8px 16px;font-size:13px;">
                    📊 Excel
                </button>
                <button id="exportCSVBtn" class="btn btn-primary" style="width:auto;padding:8px 16px;font-size:13px;">
                    📄 CSV
                </button>
            </div>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>
</div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button id="navSend" class="nav-btn">
                <span class="nav-icon">📍</span>
                <span class="nav-label">Отправить</span>
            </button>
            <button id="navHistory" class="nav-btn">
                <span class="nav-icon">📋</span>
                <span class="nav-label">История</span>
            </button>
            <button id="navAdmin" class="nav-btn">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Сотрудники</span>
            </button>
            <button id="logoutBtn" class="nav-btn">
                <span class="nav-icon">🚪</span>
                <span class="nav-label">Выйти</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
