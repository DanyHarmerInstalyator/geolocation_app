<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Геолокация сотрудников</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="app-header">
            <div class="header-content">
                <h1>📍 Геолокация</h1>
                <div id="userInfo" class="user-info hidden">
                    <span id="userName">Пользователь</span>
                    <img id="userAvatar" src="" alt="Avatar" class="avatar">
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="app-content">
            <!-- Секция авторизации -->
            <div id="authSection" class="section">
                <div class="auth-card">
                    <div class="auth-icon">📍</div>
                    <h2>Геолокация сотрудников</h2>
                    <p>Войдите или зарегистрируйтесь для отправки геолокации</p>
                    
                    <!-- Форма входа -->
                    <div id="loginForm">
                        <div class="form-group">
                            <label>Имя или Email</label>
                            <input type="text" id="loginName" placeholder="Введите имя или email" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="loginPassword" placeholder="Введите пароль" class="form-input">
                        </div>
                        <button id="loginBtn" class="btn btn-success btn-large">🔑 Войти</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToRegister" style="color:#2c3e7a;">Нет аккаунта? Зарегистрироваться</a>
                        </p>
                    </div>
                    
                    <!-- Форма регистрации -->
                    <div id="registerForm" class="hidden">
                        <div class="form-group">
                            <label>Ваше имя</label>
                            <input type="text" id="registerName" placeholder="Иван Иванов" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="registerEmail" placeholder="email@example.com" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="registerPassword" placeholder="Минимум 4 символа" class="form-input">
                        </div>
                        <button id="registerBtn" class="btn btn-success btn-large">📝 Зарегистрироваться</button>
                        <p style="margin-top:12px;text-align:center;">
                            <a href="#" id="switchToLogin" style="color:#2c3e7a;">Уже есть аккаунт? Войти</a>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Форма отправки геолокации -->
            <div id="geoSendSection" class="section hidden">
                <div class="geo-card">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                        <img id="userAvatarSmall" src="" alt="Avatar" style="width:40px;height:40px;border-radius:50%;">
                        <span id="userDisplay" style="font-weight:600;font-size:16px;"></span>
                    </div>

                    <div class="geo-status">
                        <div class="status-indicator" id="geoStatus">
                            <span class="dot"></span>
                            <span id="geoStatusText">Определение местоположения...</span>
                        </div>
                        <div id="geoCoords" class="coords-info hidden">
                            <small>Широта: <span id="lat">-</span></small>
                            <small>Долгота: <span id="lng">-</span></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comment">Комментарий</label>
                        <textarea id="comment" 
                                  placeholder="Например: Прибыл в офис, убыл на объект..."
                                  rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Фото</label>
                        <div class="photo-upload">
                            <input type="file" id="photoInput" accept="image/*" capture="environment">
                            <label for="photoInput" class="photo-label">
                                <span>📷 Добавить фото</span>
                            </label>
                            <div id="photoPreview" class="photo-preview hidden">
                                <img id="previewImg" src="" alt="Preview">
                                <button id="removePhotoBtn" class="btn-remove">✕</button>
                            </div>
                        </div>
                    </div>

                    <button id="sendGeoBtn" class="btn btn-success btn-large" disabled>
                        📤 Отправить геолокацию
                    </button>

                    <div id="sendStatus" class="send-status hidden"></div>
                </div>
            </div>

            <!-- История -->
            <div id="historySection" class="section hidden">
                <div class="history-card">
                    <h3>📋 История отправок</h3>
                    <div id="historyList" class="history-list"></div>
                </div>
            </div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button id="navSend" class="nav-btn">
                <span class="nav-icon">📍</span>
                <span class="nav-label">Отправить</span>
            </button>
            <button id="navHistory" class="nav-btn">
                <span class="nav-icon">📋</span>
                <span class="nav-label">История</span>
            </button>
            <button id="navAdmin" class="nav-btn">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Сотрудники</span>
            </button>
            <button id="logoutBtn" class="nav-btn">
                <span class="nav-icon">🚪</span>
                <span class="nav-label">Выйти</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
